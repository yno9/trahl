<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>繁体字ハイライター</title>
  <style>
    :root {
      --bg: #fafafa;
      --card: #fff;
      --border: #e0e0e0;
      --text: #222;
      --muted: #666;
      --accent: #c62828;
      --highlight: #fff59d;
      --highlight-border: #fbc02d;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Hiragino Sans", "Noto Sans CJK JP", "Yu Gothic", "Meiryo", sans-serif;
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.25rem;
      font-weight: 600;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }
    textarea {
      width: 100%;
      height: 180px;
      padding: 0.75rem;
      font-size: 1rem;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 6px;
      resize: vertical;
      background: var(--card);
    }
    textarea:focus {
      outline: 2px solid #90caf9;
      border-color: #42a5f5;
    }
    .actions {
      display: flex;
      gap: 0.5rem;
      margin: 0.75rem 0 1rem;
      flex-wrap: wrap;
    }
    button {
      padding: 0.5rem 1.1rem;
      font-size: 0.95rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
    }
    button.primary {
      background: #1565c0;
      color: #fff;
    }
    button.primary:hover { background: #0d47a1; }
    button.secondary {
      background: #eee;
      color: #333;
    }
    button.secondary:hover { background: #e0e0e0; }
    .stats {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
      min-height: 1.4em;
    }
    .stats strong { color: var(--accent); }
    #result {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      min-height: 120px;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 1.05rem;
      line-height: 1.85;
    }
    .trad {
      background: var(--highlight);
      color: var(--accent);
      font-weight: 700;
      padding: 0 3px;
      border-radius: 3px;
      border-bottom: 2px solid var(--highlight-border);
    }
    .found-list {
      margin-top: 1.25rem;
      padding: 0.9rem 1rem;
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 6px;
      display: none;
    }
    .found-list h2 {
      font-size: 0.95rem;
      margin: 0 0 0.5rem;
      font-weight: 600;
    }
    .found-chars {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .found-chars span {
      display: inline-block;
      background: var(--highlight);
      color: var(--accent);
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-size: 1.1rem;
      border: 1px solid var(--highlight-border);
    }
    .meta {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .meta a { color: #1565c0; }
    .example {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }
  </style>
</head>
<body>
  <h1>繁体字ハイライター</h1>
  <p class="subtitle">
    日本語テキスト中に残った中国語繁体字を検出してハイライトします。<br>
    辞書: OpenCC TSCharacters / STCharacters（約4,180字）
  </p>

  <label for="input">テキストを貼り付け</label>
  <textarea id="input" placeholder="ここに文章を貼り付けてください…&#10;&#10;例: 北村薰の小說的方法、櫻庭一樹、這是一個測試。"></textarea>
  <p class="example">例: 北村薰 → 薰　／　櫻庭一樹 → 櫻　／　小說的方法 → 說</p>

  <div class="actions">
    <button class="primary" onclick="highlight()">ハイライト</button>
    <button class="secondary" onclick="clearAll()">クリア</button>
    <button class="secondary" onclick="loadSample()">サンプルを入れる</button>
  </div>

  <div class="stats" id="stats"></div>
  <div id="result">（結果がここに表示されます）</div>

  <div class="found-list" id="foundList">
    <h2>検出された繁体字候補</h2>
    <div class="found-chars" id="foundChars"></div>
  </div>

  <div class="meta">
    <p>
      辞書出典:
      <a href="https://github.com/BYVoid/OpenCC" target="_blank" rel="noopener">OpenCC</a>
      （Apache-2.0）の TSCharacters.txt / STCharacters.txt から抽出。<br>
      日本語でも使われる字（例: 國・學 など）も含まれるため、文脈で判断してください。
    </p>
  </div>

  <script src="trad_chars.js"></script>
  <script>
    function highlight() {
      const text = document.getElementById('input').value;
      if (!text) {
        document.getElementById('result').textContent = '（テキストを入力してください）';
        document.getElementById('stats').textContent = '';
        document.getElementById('foundList').style.display = 'none';
        return;
      }

      const found = new Map(); // char -> count
      let html = '';
      let hitCount = 0;

      for (const char of text) {
        if (TRADITIONAL_CHARS.has(char)) {
          html += `<span class="trad">${escapeHtml(char)}</span>`;
          found.set(char, (found.get(char) || 0) + 1);
          hitCount++;
        } else {
          html += escapeHtml(char);
        }
      }

      document.getElementById('result').innerHTML = html;

      if (hitCount === 0) {
        document.getElementById('stats').textContent = '繁体字候補は見つかりませんでした。';
        document.getElementById('foundList').style.display = 'none';
      } else {
        const unique = found.size;
        document.getElementById('stats').innerHTML =
          `繁体字候補: <strong>${hitCount}</strong> 箇所（種類: ${unique}）`;

        // sort by count desc, then by codepoint
        const sorted = [...found.entries()].sort((a, b) => {
          if (b[1] !== a[1]) return b[1] - a[1];
          return a[0].codePointAt(0) - b[0].codePointAt(0);
        });

        const listEl = document.getElementById('foundChars');
        listEl.innerHTML = sorted
          .map(([c, n]) => `<span title="${n}回">${escapeHtml(c)}${n > 1 ? `<small>×${n}</small>` : ''}</span>`)
          .join('');
        document.getElementById('foundList').style.display = 'block';
      }
    }

    function clearAll() {
      document.getElementById('input').value = '';
      document.getElementById('result').textContent = '（結果がここに表示されます）';
      document.getElementById('stats').textContent = '';
      document.getElementById('foundList').style.display = 'none';
    }

    function loadSample() {
      document.getElementById('input').value =
        '北村薰の『小說的方法』を読んだ。\n' +
        '櫻庭一樹の新作も話題だ。\n' +
        '這是一個從中國來的測試文本：國學、會社、實際、經濟發展、圖書館、電影導演。\n' +
        '日本語では「国学」「会社」「実際」「経済発展」「図書館」「映画監督」と書く。';
      highlight();
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Ctrl/Cmd+Enter でハイライト
    document.getElementById('input').addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        highlight();
      }
    });
  </script>
</body>
</html>
